deploy_success:
  account: default
  server: arm
  user: bobby
  actionable: smol_roda (App)
  type: ServerActions::DeployApp
  status: success
  source: web
  payload:
    dokku_app_id: smol-roda
    repo: git@github.com:test/repo.git
    sha: abc123
  created_at: <%= 1.hour.ago %>
  running_at: <%= 55.minutes.ago %>
  finished_at: <%= 50.minutes.ago %>

deploy_running:
  account: default
  server: arm
  user: bobby
  actionable: smol_roda (App)
  type: ServerActions::DeployApp
  status: running
  source: web
  payload:
    dokku_app_id: smol-roda
  created_at: <%= 5.minutes.ago %>
  running_at: <%= 4.minutes.ago %>

deploy_failed:
  account: default
  server: arm
  user: bobby
  actionable: smol_roda (App)
  type: ServerActions::DeployApp
  status: failure
  source: web
  payload:
    dokku_app_id: smol-roda
  failure_message: "Connection refused - check server connectivity"
  created_at: <%= 2.hours.ago %>
  running_at: <%= 115.minutes.ago %>
  finished_at: <%= 110.minutes.ago %>

other_account_action:
  account: other
  server: other_server
  type: ServerActions::DeployApp
  status: success
  source: web
  payload:
    dokku_app_id: other-app
  created_at: <%= 1.hour.ago %>
  running_at: <%= 55.minutes.ago %>
  finished_at: <%= 50.minutes.ago %>
