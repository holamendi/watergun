default: &default
  fetch_container_metrics:
    class: FetchContainerMetricsJob
    schedule: every 30 seconds
  solid_cable_trim_messages:
    command: "SolidCable::TrimJob.perform_later"
    schedule: every 10 minutes
  solid_queue_clear_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches"
    schedule: every day at 1am
  trim_container_checks:
    command: "ContainerCheck.trim_in_batches"
    schedule: every 6 hours

development:
  <<: *default

production:
  <<: *default
