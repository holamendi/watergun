default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "default"
      threads: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY") { Concurrent.physical_processor_count }.to_i %>
      polling_interval: <%= ENV.fetch("JOB_POLLING_INTERVAL") { 0.5 }.to_f %>
    - queues: "turbo_streams"
      threads: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
      processes: <%= ENV.fetch("TURBO_STREAMS_JOB_CONCURRENCY") { 1 }.to_i %>
      polling_interval: <%= ENV.fetch("JOB_POLLING_INTERVAL") { 0.1 }.to_f %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
