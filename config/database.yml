default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "watergun") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "watergun") %>
  gssencmode: <%= ENV.fetch("POSTGRES_GSSENCMODE", "disable") %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "watergun_development") %>

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB", "watergun_test") %>

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
