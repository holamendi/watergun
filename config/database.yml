# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# `Litesupport.root.join("data.sqlite3")` stores
# application data in the path `./db/#{Rails.env}/data.sqlite3`
#
# idle_timeout should be set to zero, to avoid recycling sqlite connections
# and losing the page cache
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/primary_development.sqlite3

  solid_queue:
    <<: *default
    database: storage/solid_queue_development.sqlite3
    migrations_paths: db/solid_queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/primary_test.sqlite3

  solid_queue:
    <<: *default
    database: storage/solid_queue_test.sqlite3
    migrations_paths: db/solid_queue_migrate

# Warning: Make sure your production database path is on a persistent
# volume, otherwise your application data could be deleted between deploys.
#
# You may also set the Litesupport.root in production via the
# `LITESTACK_DATA_PATH` environment variable.
production:
  primary:
    <<: *default
    database: storage/primary_production.sqlite3

  solid_queue:
    <<: *default
    database: storage/solid_queue_production.sqlite3
    migrations_paths: db/solid_queue_migrate


