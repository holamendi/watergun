# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# `Litesupport.root.join("data.sqlite3")` stores
# application data in the path `./db/#{Rails.env}/data.sqlite3`
#
# idle_timeout should be set to zero, to avoid recycling sqlite connections
# and losing the page cache
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    # database: storage/primary_development.sqlite3
    database: storage/watergun_production.sqlite3

  queue:
    <<: *default
    database: storage/queue_development.sqlite3
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: storage/cable_development.sqlite3
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: storage/primary_test.sqlite3

  queue:
    <<: *default
    database: storage/queue_test.sqlite3
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: storage/cable_test.sqlite3
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: storage/primary_production.sqlite3

  queue:
    <<: *default
    database: storage/queue_production.sqlite3
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: storage/cable_production.sqlite3
    migrations_paths: db/cable_migrate

