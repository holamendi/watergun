development:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
  workers:
    - queues: "*"
      threads: 3
      polling_interval: 0.1

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
      recurring_tasks:
        my_periodic_job:
          class: Servers::SyncContainerDataJob
          schedule: every minute
  workers:
    - queues: "*"
      threads: 3
      polling_interval: 0.1
