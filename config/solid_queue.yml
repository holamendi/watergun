development:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
      recurring_tasks:
        sync_container_data:
          class: Servers::SyncContainerDataJob
          schedule: every 30 seconds
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
      polling_interval: <%= ENV.fetch("SOLID_QUEUE_POLLING_INTERVAL") { 0.5 }.to_f %>
      processes: <%= ENV.fetch("SOLID_QUEUE_PROCESSES") { Concurrent.physical_processor_count }.to_i %>

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
      recurring_tasks:
        sync_container_data:
          class: Servers::SyncContainerDataJob
          schedule: every 30 seconds
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
      polling_interval: <%= ENV.fetch("SOLID_QUEUE_POLLING_INTERVAL") { 0.5 }.to_f %>
