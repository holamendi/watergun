name: CI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Watergun
      run: |
        curl -X POST https://${{ secrets.WATERGUN_HOSTNAME }}/deployments?app_id=${{ secrets.WATERGUN_APP_ID }} -H "Authorization: Bearer ${{ secrets.WATERGUN_API_KEY }}"
