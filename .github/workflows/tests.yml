name: Rails Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: watergun
          POSTGRES_PASSWORD: watergun
          POSTGRES_DB: watergun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: watergun
      POSTGRES_PASSWORD: watergun
      POSTGRES_TEST_DB: watergun_test
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check installer
        run: bash scripts/test-install-smoke.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          ruby-version: 4.0.7
          bundler: "4.0.22"
          bundler-cache: true

      - name: Set up node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          bundle install --jobs 4 --retry 3
          npm ci

      - name: Set up database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Check Rails autoloading
        run: bundle exec rails zeitwerk:check

      - name: Check lifecycle architecture and lexical boundaries
        run: |
          bundle exec archspec check --config Archspec.rb --format json
          bundle exec ruby script/check-style-boundaries .
          bundle exec ruby test/architecture/style_boundaries_test.rb

      - name: Standard on changed Ruby files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only -z --diff-filter=ACM "$BASE_SHA" HEAD -- '*.rb' Gemfile script/check-style-boundaries | xargs -0 -r bundle exec standardrb --no-fix --

      - name: Check UI consistency
        run: script/check-ui-consistency

      - name: Build test assets
        run: bundle exec vite build --clear --mode=test

      - name: Run tests
        run: bundle exec rails test
