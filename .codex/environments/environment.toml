# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "watergun"

[setup]
script = '''
set -e

mise install
mise exec -- gem install bundler --conservative
mise exec -- bundle check || mise exec -- bundle install
mise exec -- npm ci

generate_ar_encryption_env() {
  env_file="$1"

  if [ -f "$env_file" ]; then
    return
  fi

  {
    echo "# Generated for Codex local development."
    echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(mise exec -- ruby -rsecurerandom -e 'print SecureRandom.hex(32)')"
    echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(mise exec -- ruby -rsecurerandom -e 'print SecureRandom.hex(32)')"
    echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(mise exec -- ruby -rsecurerandom -e 'print SecureRandom.hex(32)')"
  } > "$env_file"
}

generate_ar_encryption_env .env.development.local
generate_ar_encryption_env .env.test

mise exec -- bin/vite build --clear --mode=test
mise exec -- bin/rails db:prepare
mise exec -- bin/rails db:seed
'''

[[actions]]
name = "Run"
icon = "run"
command = "mise exec -- bin/dev"

[[actions]]
name = "Test"
icon = "test"
command = "mise exec -- bin/vite build --clear --mode=test && mise exec -- bin/rails test"

[[actions]]
name = "Lint"
icon = "check"
command = "mise exec -- bundle exec standardrb"

[[actions]]
name = "Prepare DB"
icon = "database"
command = "mise exec -- bin/rails db:prepare"

[[actions]]
name = "Local Dokku Status"
icon = "server"
command = "mise exec -- bin/local-dokku status"

[[actions]]
name = "Local Dokku Setup"
icon = "server"
command = "mise exec -- bin/local-dokku setup"
